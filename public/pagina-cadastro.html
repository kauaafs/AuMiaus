<!DOCTYPE html>
<html>
    <head>
        <title>PetShop AuMiaus</title>
        <link rel="stylesheet" href="style.css">
    </head>   
    <body>
        <header>
        <img src="/fotos/logo.png" width="200" alt="PetShop AuMiaus Logo">
        <h1>PetShop AuMiaus</h1>
         <a href="/public/index.html"><button>Voltar</button></a>
        </header>
        <section>
        <h1>Cadastre-se</h1>
        <form id="cadastroForm" method="POST">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required><br><br>

            <input type="submit" value="Cadastrar">
        </form>
            <p id="respostaCadastro" style="font-weight: bold; margin-top: 10px;"></p>
            
            <script src="script.js"></script>
        </section>
        
    </body>
</html>
